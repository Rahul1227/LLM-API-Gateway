apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway-ingress
  namespace: llm-gateway
spec:
  ingressClassName: nginx
  rules:
    - host: llm-gateway.local
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000
            pathType: Prefix
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 8501
